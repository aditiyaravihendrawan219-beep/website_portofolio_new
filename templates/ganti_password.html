<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganti Password Admin - Portofolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body class="login-page">

    <div class="login-card">
        <h2 class="login-title">GANTI PASSWORD</h2>
        
        {% if error %}
        <p class="login-error">{{ error }}</p>
        {% endif %}

        {% if success %}
        <p style="color: #2ecc71; background: rgba(46, 204, 113, 0.12); padding: 10px; border-radius: 8px; font-size: 13px; text-align: center; margin-bottom: 20px; font-weight: 600;">{{ success }}</p>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="username">Username Admin</label>
                <input type="text" id="username" name="username" class="login-input" required>
            </div>
            
            <div class="form-group">
                <label for="password_lama">Password Lama</label>
                <input type="password" id="password_lama" name="password_lama" class="login-input" required>
            </div>

            <div class="form-group">
                <label for="password_baru">Password Baru</label>
                <input type="password" id="password_baru" name="password_baru" class="login-input" required>
            </div>
            
            <button type="submit" class="btn-login">SIMPAN PASSWORD BARU</button>
        </form>

        <div class="back-link-wrapper">
            <a href="{{ url_for('login') }}" class="back-link">← Kembali ke Login</a>
        </div>
    </div>

</body>
</html>
